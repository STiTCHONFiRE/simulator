name: Build & Push to GHCR

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          native-image-job-reports: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name and tags
        shell: bash
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${OWNER}/${REPO}" >> $GITHUB_ENV
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build native executable
        shell: bash
        run: mvn -B -Pnative -DskipTests clean native:compile

      - name: Build and push native image
        shell: bash
        run: |
          docker buildx build \
            --file Dockerfile.native \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:native" \
            --tag "${IMAGE}:${SHA_TAG}" \
            --tag "${IMAGE}:${SHA_TAG}-native" \
            --push .

      - name: Build and push JVM fallback (Jib)
        shell: bash
        run: |
          mvn -B -Pjvm-fallback -DskipTests \
            -Dimage.name="${IMAGE}" \
            -Djib.to.tags="jvm,${SHA_TAG}-jvm" \
            clean compile jib:build
