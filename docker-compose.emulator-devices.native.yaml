      SIM_MODEL: "Antminer S19k Pro"
      SIM_FIRMWARE: "FR-1.28(251010-S19k Pro)"
      SIM_SYSTEM_FILESYSTEM_VERSION: "FR-1.28(251010-S19k Pro)"
