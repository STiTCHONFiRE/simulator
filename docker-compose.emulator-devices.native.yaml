      SIM_IDLE_TEMPERATURE_C: "30.0"
      SIM_IDLE_TEMPERATURE_DELTA_C: "15.0"
      SIM_REBOOT_DOWNTIME: "30s"
      SIM_AUTH_USERNAME: "root"
      SIM_AUTH_PASSWORD: "root"
      SIM_CGMINER_PORTS: "4028,4029"
      SIM_CGMINER_SOCKET_READ_TIMEOUT_MS: "1000"
    labels:
      simulator.device_code: "D001"
